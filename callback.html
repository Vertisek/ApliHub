<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApliHub Soclify — Autoryzacja Konta</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #09090b;
      color: #f4f4f5;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: rgba(24, 24, 27, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 40px rgba(34, 197, 94, 0.15);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(245, 158, 11, 0.2);
      border-top: 4px solid #f59e0b;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 20px auto;
    }
    .success-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(34, 197, 94, 0.15);
      border: 2px solid #22c55e;
      color: #22c55e;
      font-size: 32px;
      display: none;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      font-weight: bold;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 {
      font-size: 22px;
      margin: 0 0 12px 0;
      color: #fff;
      font-weight: 800;
    }
    p {
      font-size: 14.5px;
      color: #cbd5e1;
      line-height: 1.6;
      margin: 0 0 20px 0;
    }
    .btn {
      display: inline-block;
      background: #22c55e;
      color: #000;
      font-weight: 800;
      font-size: 14px;
      padding: 13px 30px;
      border-radius: 10px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      margin: 6px;
    }
    .btn:hover {
      background: #16a34a;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(34, 197, 94, 0.35);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.18);
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <div class="success-icon" id="success-icon">✓</div>
    <h2 id="status-title">Przetwarzanie autoryzacji...</h2>
    <p id="status-desc">Trwa bezpieczne przekazywanie danych do aplikacji Soclify.</p>
    <div id="action-buttons" style="display:none;">
      <a href="#" class="btn" id="open-app-btn">🚀 Otwórz Aplikację Soclify</a>
      <button class="btn btn-secondary" onclick="window.close()">Zamknij</button>
    </div>
  </div>

  <script>
    (async function() {
      const searchParams = new URLSearchParams(window.location.search);
      const hash = window.location.hash ? window.location.hash.substring(1) : '';
      const hashParams = new URLSearchParams(hash.startsWith('?') ? hash : '?' + hash);

      const accessToken = hashParams.get('access_token') || searchParams.get('access_token');
      const code = searchParams.get('code') || hashParams.get('code');
      const state = searchParams.get('state') || hashParams.get('state') || '';
      const error = searchParams.get('error') || hashParams.get('error');

      const titleEl = document.getElementById('status-title');
      const descEl = document.getElementById('status-desc');
      const spinnerEl = document.getElementById('spinner');
      const successIconEl = document.getElementById('success-icon');
      const actionBtns = document.getElementById('action-buttons');
      const openAppBtn = document.getElementById('open-app-btn');

      if (error) {
        spinnerEl.style.display = 'none';
        titleEl.textContent = 'Błąd autoryzacji';
        titleEl.style.color = '#ef4444';
        descEl.textContent = 'Nie udało się połączyć konta: ' + error;
        actionBtns.style.display = 'block';
        openAppBtn.style.display = 'none';
        return;
      }

      let detectedPlatform = 'youtube';
      if (state.startsWith('twitch') || window.location.href.includes('twitch') || hash.includes('twitch')) {
        detectedPlatform = 'twitch';
      } else if (state.startsWith('youtube') || window.location.href.includes('youtube') || hash.includes('youtube')) {
        detectedPlatform = 'youtube';
      } else if (state.startsWith('tiktok') || sessionStorage.getItem('tiktok_oauth_state') === state) {
        detectedPlatform = 'tiktok';
      } else if (state.startsWith('instagram') || window.location.href.includes('instagram')) {
        detectedPlatform = 'instagram';
      } else if (state.startsWith('facebook') || window.location.href.includes('facebook')) {
        detectedPlatform = 'facebook';
      }

      // Store in local/session storage
      if (accessToken) {
        localStorage.setItem(detectedPlatform + '_token', accessToken);
        localStorage.setItem(detectedPlatform + '_access_token', accessToken);
      }
      if (code) {
        localStorage.setItem(detectedPlatform + '_code', code);
      }

      // 1. Post message to Opener Window (Popup flow)
      let sentToOpener = false;
      if (window.opener && !window.opener.closed) {
        try {
          window.opener.postMessage({
            type: code ? 'SOCLIFY_OAUTH_CODE' : 'SOCLIFY_OAUTH_SUCCESS',
            platform: detectedPlatform,
            token: accessToken,
            code: code,
            state: state
          }, '*');
          sentToOpener = true;
        } catch (e) {
          console.warn('postMessage to opener failed:', e);
        }
      }

      // 2. BroadcastChannel
      try {
        const bc = new BroadcastChannel('aplihub_oauth_channel');
        bc.postMessage({
          type: code ? 'SOCLIFY_OAUTH_CODE' : 'SOCLIFY_OAUTH_SUCCESS',
          platform: detectedPlatform,
          token: accessToken,
          code: code,
          state: state
        });
      } catch (e) {}

      // Update UI
      spinnerEl.style.display = 'none';
      successIconEl.style.display = 'flex';
      titleEl.textContent = '🎉 Połączono pomyślnie!';
      titleEl.style.color = '#22c55e';
      descEl.innerHTML = 'Twoje konto <strong>' + detectedPlatform.toUpperCase() + '</strong> zostało pomyślnie autoryzowane.<br>Aplikacja Soclify odbiera dane kanału...';
      actionBtns.style.display = 'block';

      // Set fallback direct app URL if needed
      const appUrl = 'http://localhost:54321/index.html?code=' + encodeURIComponent(code || '') + '&state=' + encodeURIComponent(state) + '&connected=' + detectedPlatform;
      openAppBtn.href = appUrl;

      // If opened in popup and communicated with opener, auto-close after 1.5s
      if (sentToOpener) {
        setTimeout(function() {
          try { window.close(); } catch (e) {}
        }, 1500);
      }
    })();
  </script>
</body>
</html>
